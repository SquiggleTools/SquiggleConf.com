description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.34.2
    - uses: actions/setup-node@v4
      with:
        cache: pnpm
        node-version: "24"
    - run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
